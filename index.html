<!DOCTYPE html>
<html lang="en">
<head>

<meta name="theme-color" content="#1c1917" />

<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;padding:2rem;

  <img src="app/icon-512.png" alt="Domino Studio icon" />
